# drone_telemetry: telemetry and commands over the SiK 433 MHz radio (MAVLink v2, drone_dialect).
drone_telemetry:
  ros__parameters:
    port: /dev/ttyUSB0          # Jetson: /dev/telem_radio (udev, script/udev/setup_radio_udev.sh)
    baud: 57600                 # must match the radio SERIAL_SPEED (ATI5: SERIAL_SPEED=57)
    system_id: 1
    component_id: 191           # MAV_COMP_ID_ONBOARD_COMPUTER

    send_rate_hz: 1.0           # full status period; changes are sent immediately
    heartbeat_rate_hz: 1.0
    stale_timeout_s: 3.0        # no data for this long -> STALE / NO_DATA

    # Listed in send order. Each id must match the DRONE_COMPONENT enum in mavlink/drone_telemetry.xml.
    components: [lidar, gimbal, camera, px4]

    lidar:
      id: 1
      source: diagnostics
      diag_name: "stl_50b2_driver: lidar"
      state_key: state
      rate_key: scan_rate_hz

    gimbal:
      id: 2
      source: diagnostics
      diag_name: skydroid/gimbal
      state_key: state
      # attitude_hz is the configured rate, so the real rate is derived from the total_attitudes counter
      count_key: total_attitudes

    camera:
      id: 3
      source: diagnostics
      diag_name: skydroid/camera/RGB
      state_key: state
      rate_key: measured_fps

    px4:
      id: 4
      source: topic             # PX4 has no /diagnostics; count messages instead
      topic: /fmu/out/vehicle_local_position_v1
      msg_type: px4_msgs/msg/VehicleLocalPosition
      min_rate_hz: 10.0         # below this -> WARN / LOW_RATE

    # vehicle_odometry -> DRONE_LOCAL_POSE (GCS 3D view).
    pose:
      enabled: true
      topic: /fmu/out/vehicle_odometry
      msg_type: px4_msgs/msg/VehicleOdometry
      rate_hz: 5.0              # ~60 B per packet -> 300 B/s of the ~2 KB/s 433 radio
      max_age_s: 0.5            # older samples are not sent

    # vehicle_global_position -> GLOBAL_POSITION_INT (~40 B, 2 Hz ~80 B/s): GCS map position without the 915 link.
    global_position:
      enabled: true
      topic: /fmu/out/vehicle_global_position
      rate_hz: 2.0
      max_age_s: 1.0

    # /gimbal_state -> DRONE_GIMBAL_STATE (~30 B, 2 Hz ~60 B/s).
    gimbal_state:
      enabled: true
      topic: /gimbal_state
      msg_type: skydroid_msgs/msg/GimbalState
      rate_hz: 2.0
      max_age_s: 1.5

    # Ground commands: Take-off / Land / Hold / RTL / Start mission, plus waypoint upload (/gcs/mission, JSON).
    # Safety rules: drone_telemetry/commands.py.
    commands:
      enabled: true
      # Take-off / Land: mission = mission_manager -> offboard_control (OFFBOARD)
      #                  px4     = VehicleCommand (PX4 auto Takeoff / Land modes)
      # Hold / RTL always use VehicleCommand.
      takeoff_land_via: mission
      gcs_command_topic: /gcs/command          # -> mission_manager (JSON {id, cmd, alt})
      gcs_command_ack_topic: /gcs/command_ack  # <- mission_manager (JSON {id, result, text})
      px4_system_id: 1
      command_topic: /fmu/in/vehicle_command
      ack_topic: ""          # empty: derived from MESSAGE_VERSION (1.17: vehicle_command_ack, 1.18: ..._v1)
      control_mode_topic: /fmu/out/vehicle_control_mode   # armed state (VehicleStatus versions differ)
      land_topic: /fmu/out/vehicle_land_detected
      global_topic: /fmu/out/vehicle_global_position
      mission_topic: /gcs/mission
