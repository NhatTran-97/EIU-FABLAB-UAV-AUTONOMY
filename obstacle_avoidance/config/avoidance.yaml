# Starting parameters for obstacle_avoidance. Tune in SITL before flying.
obstacle_avoidance:
  ros__parameters:
    scan_topic: /scan
    local_position_topic: /fmu/out/vehicle_local_position_v1
    attitude_topic: /fmu/out/vehicle_attitude

    # ---- Lidar mounting ----
    # Angle of the lidar x axis relative to the drone nose (FLU, positive = left). CHECK WITH A STATIC TEST.
    lidar_yaw_offset_deg: 0.0
    lidar_upside_down: false
    min_range: 0.3            # m, closer points are dropped (propellers)
    max_range: 12.0           # m, same as the driver's range_max; VFH+ still looks only within window_radius
    # Arcs hidden by the frame, in raw /scan angles (degrees), "a:b, c:d". Empty = nothing hidden.
    self_mask_deg: ""
    despeckle_tol: 0.3        # m, 0 = single-beam noise filter off

    # ---- Ground filter when the drone tilts ----
    ground_filter: true
    ground_margin: 0.3        # m
    ground_z: 0.0             # NED z of the ground when PX4 has no dist_bottom (0 = take-off ground)

    # ---- VFH+ ----
    sector_deg: 5.0
    window_radius: 8.0        # m
    drone_radius: 0.5         # m, including the propellers
    safety_margin: 1.0        # m
    block_distance: 3.0       # m, > drone_radius + safety_margin; only decides whether to dodge EARLY or LATE
    free_distance: 3.5        # m, hysteresis for reopening a sector
    wide_valley_sectors: 8
    min_valley_sectors: 1
    mu_goal: 5.0              # must be > mu_motion + mu_prev
    mu_motion: 2.0
    mu_prev: 2.0

    # ---- Physical constants: ROS CANNOT measure these, they must match PX4 ----
    # Speed is NOT set by hand: every scan computes the highest v with v*T + v^2/(2*max_decel) <= free
    # distance, where T = MEASURED latency (scan -> status) + actuation_latency. Carrot = v / px4_xy_p.
    max_speed: 2.0            # m/s, upper limit, <= MPC_XY_VEL_MAX
    max_decel: 2.0            # m/s^2, more conservative than MPC_ACC_HOR (PX4 default 3.0)
    px4_xy_p: 0.95            # = MPC_XY_P on PX4
    actuation_latency: 0.15   # s, from publishing the status to PX4 starting to brake (manager / offboard are event-driven)
    motion_speed_threshold: 0.3   # m/s, below this the drone counts as stationary (inertia ignored)

    # ---- Timing: NO rates here, everything is measured at runtime ----
    # timeout of each input = timeout_periods * p90(measured period), capped by max_timeout.
    # Without enough samples LaserScan.scan_time is used, and without that max_timeout.
    timeout_periods: 3.0
    max_timeout: 1.0          # s, blind for longer than this is always STALE (also the assumed latency at start)
    diagnostics_period: 5.0   # s, period of the [diag] log of rates / latency / allowed speed

    start_enabled: false      # mission_manager enables the node through /avoidance/enable
    # Second safety layer: publish /fmu/in/obstacle_distance for PX4 Collision Prevention (CP_DIST).
    publish_obstacle_distance: false
